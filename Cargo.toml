[workspace]
members = ["crates/simulation", "crates/protocol", "crates/server", "crates/frontend"]
resolver = "2"
[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# Level demos are CPU-bound simulations. Optimised test binaries keep the full
# campaign regression around seconds instead of minutes, while `cargo test`
# still builds dependencies once and caches them.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
