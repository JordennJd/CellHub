<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CellHub · WebGL Quad</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #090e17; color: #e6edf7; font: 15px system-ui, sans-serif; }
    main { width: min(100%, 1100px); margin: auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #9eacc2; margin: 0 0 24px; }
    canvas { display: block; width: 100%; height: 70vh; border: 1px solid #263348; border-radius: 12px; }
    #status { margin-top: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>CellHub / Quad</h1>
    <p>Отрисовка на C++ через WebAssembly и WebGL 2</p>
    <canvas id="canvas" width="960" height="640" aria-label="Цветной квадрат"></canvas>
    <p id="status" role="status">Загрузка WebAssembly…</p>
  </main>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      printErr: function (text) { console.error(text); },
      onAbort: function (reason) {
        document.getElementById('status').textContent = 'Ошибка запуска: ' + reason;
      }
    };
    Module.canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      document.getElementById('status').textContent = 'Контекст WebGL потерян. Перезагрузите страницу.';
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
