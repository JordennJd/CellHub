[package]
name = "cellhub-frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=24.0.5", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
bytemuck = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "ResizeObserver", "Window", "console"] }
js-sys = "0.3"
ab_glyph = "0.2"
epaint_default_fonts = "=0.31.1"
