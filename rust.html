<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CellHub Rust</title><style>html,body{margin:0;width:100%;height:100%;background:#091411;color:white}canvas{width:100%;height:100%;display:block}#error{position:absolute;top:0;white-space:pre-wrap}</style></head><body><canvas id="canvas"></canvas><div id="error"></div><script type="module">
import init,{start} from './frontend/rust-wasm/cellhub_frontend.js';
try { if(!navigator.gpu) throw new Error('WebGPU недоступен. Используйте совместимый браузер на localhost или HTTPS.'); const q=new URLSearchParams(location.search); await init(); await start(document.getElementById('canvas'),Math.min(5000,Math.max(0,Number(q.get('count'))||0)),q.has('paused')); window.cellhubReady=true; } catch(e) {document.getElementById('error').textContent=String(e);console.error(e);}
</script></body></html>
