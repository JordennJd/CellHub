name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cellhub-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ручной запуск тоже не должен деплоить произвольную ветку.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-09
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
          components: rust-src

      - name: Кэшировать Rust target и cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: true
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Кэшировать wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}

      - name: Установить wasm-bindgen-cli 0.2.130
        run: |
          if ! command -v wasm-bindgen >/dev/null || ! wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.130'; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked
          fi

      - run: npm ci

      - name: Собрать production-сборку
        run: npm run build

      - name: Собрать статический сервер
        env:
          # Продовый хост — x86_64; для старой ARM-VM задайте
          # переменную репозитория DEPLOY_SERVER_TARGET=aarch64-unknown-linux-musl.
          CELLHUB_SERVER_TARGET: ${{ vars.DEPLOY_SERVER_TARGET || 'x86_64-unknown-linux-musl' }}
        run: bash scripts/build-server.sh

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Задеплоить dist/ и сервер
        shell: bash
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$PORT"
          test -n "$USER"
          ssh_opts=(-p "$PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="$USER@$HOST"
          remote_home=$(ssh "${ssh_opts[@]}" "$target" 'printf %s "$HOME"')
          test -n "$remote_home"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$remote_home/.local/bin'"
          rsync -az --delete --delay-updates --exclude '.*' --chmod=D755,F644 \
            -e "ssh ${ssh_opts[*]}" dist/ "$target:$remote_home/"
          rsync -az --chmod=F755 -e "ssh ${ssh_opts[*]}" \
            target/deploy/cellhub-server "$target:$remote_home/.local/bin/cellhub-server.new"
          ssh "${ssh_opts[@]}" "$target" \
            "bash -s -- '$remote_home' '8081' 'cellhub.service'" \
            < scripts/deploy-remote.sh
